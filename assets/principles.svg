<svg viewBox="0 0 1200 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Engineering principles</title>
  <desc id="description">Requirements before implementation, security at system boundaries, and validation as delivery work.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141a22"/>
      <stop offset="1" stop-color="#090c11"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".025"/>
    </pattern>
  </defs>
  <rect x="1" y="1" width="1198" height="248" rx="12" fill="url(#panel)" stroke="#fff" stroke-opacity=".24"/>
  <rect x="1" y="1" width="1198" height="248" rx="12" fill="url(#grid)"/>
  <path d="M400 28v194M800 28v194" stroke="#fff" stroke-opacity=".14"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <g transform="translate(200)">
      <rect x="-22" y="40" width="44" height="44" rx="12" fill="#1b232d" stroke="#fff" stroke-opacity=".42"/>
      <text y="68" font-size="13" font-weight="700" fill="#f7f8fa">01</text>
      <text y="119" font-size="16" font-weight="700" letter-spacing="1.5" fill="#f7f8fa">REQUIREMENTS</text>
      <text y="157" font-size="14" fill="#b8bec8">Understand the business problem</text>
      <text y="181" font-size="14" fill="#969fac">before choosing the solution.</text>
    </g>
    <g transform="translate(600)">
      <rect x="-22" y="40" width="44" height="44" rx="12" fill="#1b232d" stroke="#fff" stroke-opacity=".42"/>
      <text y="68" font-size="13" font-weight="700" fill="#f7f8fa">02</text>
      <text y="119" font-size="16" font-weight="700" letter-spacing="1.5" fill="#f7f8fa">SECURITY</text>
      <text y="157" font-size="14" fill="#b8bec8">Enforce access at system</text>
      <text y="181" font-size="14" fill="#969fac">boundaries, not only in the UI.</text>
    </g>
    <g transform="translate(1000)">
      <rect x="-22" y="40" width="44" height="44" rx="12" fill="#1b232d" stroke="#fff" stroke-opacity=".42"/>
      <text y="68" font-size="13" font-weight="700" fill="#f7f8fa">03</text>
      <text y="119" font-size="16" font-weight="700" letter-spacing="1.5" fill="#f7f8fa">VALIDATION</text>
      <text y="157" font-size="14" fill="#b8bec8">Treat tests and documentation</text>
      <text y="181" font-size="14" fill="#969fac">as part of delivery.</text>
    </g>
  </g>
</svg>
