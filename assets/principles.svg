<svg viewBox="0 0 1200 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Engineering principles: Architecture, Security, Maintainability">
  <defs>
    <pattern id="pgrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161b22" stroke-width="1"/>
    </pattern>
  </defs>

  <rect x="2" y="2" width="1196" height="236" rx="8" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
  <rect x="2" y="2" width="1196" height="236" rx="8" fill="url(#pgrid)"/>

  <line x1="400" y1="30" x2="400" y2="210" stroke="#30363D" stroke-width="1"/>
  <line x1="800" y1="30" x2="800" y2="210" stroke="#30363D" stroke-width="1"/>

  <!-- Column 1: Architecture -->
  <text x="200" y="56" text-anchor="middle" font-family="SFMono-Regular, Consolas, monospace" font-size="13" letter-spacing="1" fill="#4FD1C5">01 · ARCHITECTURE</text>
  <text x="200" y="108" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#E6EDF3">Modular, scalable</text>
  <text x="200" y="132" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#E6EDF3">systems with clear</text>
  <text x="200" y="156" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#E6EDF3">separation of concerns</text>

  <!-- Column 2: Security -->
  <text x="600" y="56" text-anchor="middle" font-family="SFMono-Regular, Consolas, monospace" font-size="13" letter-spacing="1" fill="#F6AD55">02 · SECURITY</text>
  <text x="600" y="108" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#E6EDF3">Security built in from</text>
  <text x="600" y="132" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#E6EDF3">the start — auth, access</text>
  <text x="600" y="156" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#E6EDF3">control, data protection</text>

  <!-- Column 3: Maintainability -->
  <text x="1000" y="56" text-anchor="middle" font-family="SFMono-Regular, Consolas, monospace" font-size="13" letter-spacing="1" fill="#68D391">03 · MAINTAINABILITY</text>
  <text x="1000" y="108" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#E6EDF3">Clean, documented code</text>
  <text x="1000" y="132" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#E6EDF3">that's easy to test,</text>
  <text x="1000" y="156" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#E6EDF3">extend, and maintain</text>
</svg>
